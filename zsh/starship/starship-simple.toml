# Prompt limpio en dos líneas. Usa colores ANSI: así hereda la paleta que
# Noctalia genera para kitty desde el fondo de pantalla (sin colores fijos).
scan_timeout = 1000
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$python\
$nodejs\
$lua\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = '[❯](bold blue)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

[directory]
style = 'bold white'
read_only_style = 'red'
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
home_symbol = '~'
read_only = ' 󰌾'

[git_branch]
symbol = ' '
style = 'purple'
format = '[$symbol$branch]($style) '

[git_state]
style = 'yellow'
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = 'bright-black'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
untracked = '?'
stashed = '≡'
modified = '!'
staged = '+'
renamed = '»'
deleted = '✕'

[git_metrics]
disabled = false
added_style = 'green'
deleted_style = 'red'
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[fill]
symbol = ' '

[python]
symbol = ' '
style = 'bright-black'
format = '[$symbol$version( \($virtualenv\))]($style) '
pyenv_version_name = true
python_binary = 'python3'

[nodejs]
symbol = ' '
style = 'bright-black'
format = '[$symbol$version]($style) '

[lua]
symbol = ' '
style = 'bright-black'
format = '[$symbol$version]($style) '

[cmd_duration]
min_time = 1500
style = 'yellow'
format = '[󱦟 $duration]($style) '
