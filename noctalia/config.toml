# =============================================================================
#   NOCTALIA SHELL - CONFIGURACIÓN DE LA BARRA SUPERIOR
#   Solución a solapamiento, separación de módulos, espaciado y truncado
# =============================================================================

[bar.default]
enabled = true
position = "top"
layer = "top"
thickness = 38
padding = 14
widget_spacing = 12 # Espaciado suficiente (12px) entre módulos para evitar solapamientos
margin_edge = 0
margin_opposite_edge = 0
margin_ends = 0
radius = 14
capsule_radius = 10
background_opacity = 0.94

# -----------------------------------------------------------------------------
# ESTRUCTURA Y DISTRIBUCIÓN DE MÓDULOS
# -----------------------------------------------------------------------------
# Izquierda: Lanzador Rofi, Reloj e indicadores de Workspaces
start = [
    "Rofi",
    "wallpaper",
    "workspaces",
    "clock"
]

# Centro: Reproductor multimedia aislado en el centro
center = [
    "media"
]

# Derecha: Bandeja del sistema y estado (sin duplicados)
end = [
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clipboard",
    "notifications",
    "settings",
    "session"
]

# -----------------------------------------------------------------------------
# CONFIGURACIÓN DE WIDGETS
# -----------------------------------------------------------------------------

# Reproductor: solo aparece cuando hay algo sonando
[widget.media]
type = "media"
max_length = 220.0
min_length = 60.0
art_size = 18.0
title_scroll = "none"
hide_when_no_media = true

# Estado: solo iconos; el valor aparece al pasar el ratón (peek)
[widget.network]
type = "network"
peek = true

[widget.volume]
type = "volume"
peek = true

[widget.brightness]
type = "brightness"
peek = true

[widget.bluetooth]
type = "bluetooth"
hide_when_adapter_off = true

[widget.battery]
type = "battery"
display_mode = "graphic"
label_content = "percent"

# Widget: Reloj
[widget.clock]
type = "clock"
format = "%H:%M"
scale = 1.3

# Widget: Botón de Rofi
[widget.Rofi]
type = "custom_button"
glyph = "apps-filled"

    [widget.Rofi.actions]
    left = "exec rofi -show drun"
