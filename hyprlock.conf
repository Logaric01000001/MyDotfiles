# =============================================================================
#   HYPRLOCK - PANTALLA DE BLOQUEO MODERNA Y ESTÉTICA (Catppuccin Mocha)
# =============================================================================

# FONDO CON EFECTO FROSTED GLASS (Desenfoque multicapa)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.90
    brightness = 0.80
    color = rgba(17, 17, 27, 0.9)
}

# RELOJ GIGANTE MODERNO (Horas y Minutos)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 0.95)
    font_size = 84
    font_family = Inter Bold, sans-serif
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# FECHA COMPLETA EN ESPAÑOL
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B" | sed 's/.*/\u&/')"
    color = rgba(166, 173, 200, 0.85)
    font_size = 18
    font_family = Inter, sans-serif
    position = 0, 40
    halign = center
    valign = center
}

# CAMPO DE ENTRADA DE CONTRASEÑA (Diseño Pill con borde Mauve y sombras)
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(203, 166, 247, 0.85)
    inner_color = rgba(24, 24, 37, 0.85)
    font_color = rgb(205, 214, 244)
    
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Introduce tu contraseña...</span>
    hide_input = false
    rounding = 26
    
    check_color = rgb(137, 180, 250)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    
    position = 0, -45
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.3)
}

# ETIQUETA DE USUARIO / SESIÓN
label {
    monitor =
    text =   $USER
    color = rgba(166, 173, 200, 0.6)
    font_size = 14
    font_family = Inter, sans-serif
    position = 0, -100
    halign = center
    valign = center
}
