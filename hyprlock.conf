# =============================================================================
#   HYPRLOCK — pantalla de bloqueo
#   Neutra a propósito: funciona con cualquier fondo y paleta de Noctalia.
# =============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = suave, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, suave
    animation = fadeOut, 1, 4, suave
    animation = inputFieldDots, 1, 2, suave
}

# Fondo: el escritorio desenfocado y oscurecido
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 9
    noise = 0.012
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.12
    color = rgba(10, 10, 12, 1.0)
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.96)
    font_size = 96
    font_family = Adwaita Sans Light
    position = 0, 120
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d de %B" | sed 's/.*/\u&/'
    color = rgba(255, 255, 255, 0.62)
    font_size = 15
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    rounding = 14
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(255, 255, 255, 0.06)
    font_color = rgba(255, 255, 255, 0.92)
    font_family = Adwaita Sans
    check_color = rgba(255, 255, 255, 0.40)
    fail_color = rgba(255, 140, 130, 0.85)
    capslock_color = rgba(255, 210, 120, 0.85)

    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">Contraseña</span>
    fail_text = <span foreground="##ff8c82">Contraseña incorrecta</span>
    fail_timeout = 2000
    hide_input = false

    position = 0, -50
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.45)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, -110
    halign = center
    valign = center
}

# Aviso de bloq mayús
label {
    monitor =
    text = cmd[update:500] [ "$(cat /sys/class/leds/*capslock/brightness 2>/dev/null | head -1)" = "1" ] && echo "Bloq Mayús activado" || echo ""
    color = rgba(255, 210, 120, 0.85)
    font_size = 10
    font_family = Adwaita Sans
    position = 0, -140
    halign = center
    valign = center
}
