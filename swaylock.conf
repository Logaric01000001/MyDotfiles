# =============================================================================
#   SWAYLOCK-EFFECTS - ULTRA PREMIUM (Catppuccin Mocha Frosted Glass)
# =============================================================================

# -----------------------------------------------------------------------------
# EFECTO DE FONDO (Frosted Glass Suave y Fluido)
# -----------------------------------------------------------------------------
screenshots
# Escala previa para crear un desenfoque tipo cristal esmerilado sin pixelación
effect-scale=0.5
effect-blur=20x10
effect-vignette=0.35:0.75
fade-in=0.2

# -----------------------------------------------------------------------------
# RELOJ Y TIPOGRAFÍA
# -----------------------------------------------------------------------------
clock
timestr=%H:%M
datestr=%A, %d de %B

font=Inter
font-size=20
date-str=%A, %d de %B

# -----------------------------------------------------------------------------
# ANILLO E INDICADOR INTERACTIVO
# -----------------------------------------------------------------------------
indicator
indicator-radius=135
indicator-thickness=9
indicator-caps-lock

# -----------------------------------------------------------------------------
# PALETA CATPPUCCIN MOCHA (Colores armoniosos y transparentes)
# -----------------------------------------------------------------------------
# Fondo base
color=11111b90

# Estado Normal / Reposo (Fondo translúcido oscuro con aro Mauve)
inside-color=18182580
ring-color=cba6f7
text-color=cdd6f4
line-color=00000000
separator-color=00000000

# Estado Verificando / Cargando (Azul zafiro)
inside-ver-color=181825aa
ring-ver-color=89b4fa
text-ver-color=89b4fa

# Estado Error / Contraseña incorrecta (Rojo suave)
inside-wrong-color=181825aa
ring-wrong-color=f38ba8
text-wrong-color=f38ba8

# Estado Limpiando / Backspace (Amarillo pastel)
inside-clear-color=181825aa
ring-clear-color=f9e2af
text-clear-color=f9e2af

# Feedback al escribir caracteres (Verde esmeralda y Rosa)
key-hl-color=a6e3a1
bs-hl-color=f38ba8

# Caps Lock activo
text-caps-lock-color=fab387

# -----------------------------------------------------------------------------
# COMPORTAMIENTO
# -----------------------------------------------------------------------------
ignore-empty-password
grace=2
show-failed-attempts
