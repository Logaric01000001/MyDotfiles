[General]
enable-animations = true
animated-background-placeholder = ""

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 50
padding-left = 50
background = "current_wallpaper.png"
use-background-color = false
background-color = "#1e1e2e"
blur = 0
brightness = 0.0

[LockScreen.Clock]
display = true
position = top-left
align = center
format = hh:mm
font-family = JetBrainsMono Nerd Font
font-size = 120
font-weight = 900
color = "#cba6f7"

[LockScreen.Date]
display = true
format = dddd, MMMM dd, yyyy
font-family = Inter
font-size = 22
font-weight = 600
color = "#89b4fa"
margin-top = -15

[LockScreen.Message]
display = true
position = bottom-left
align = left
text = Presiona cualquier tecla para continuar
font-family = Inter
font-size = 16
font-weight = 500
display-icon = true
icon = enter.svg
icon-size = 16
color = "#a6adc8"
paint-icon = true
spacing = 8

[LoginScreen]
background = "current_wallpaper.png"
use-background-color = false
background-color = "#1e1e2e"
blur = 60
brightness = -0.15

[LoginScreen.LoginArea]
position = left
margin = 60

[LoginScreen.LoginArea.Avatar]
shape = circle
border-radius = 40
active-size = 120
inactive-size = 80
inactive-opacity = 0.4
active-border-size = 2
inactive-border-size = 0
active-border-color = "#cba6f7"
inactive-border-color = "#45475a"

[LoginScreen.LoginArea.Username]
font-family = JetBrainsMono Nerd Font
font-size = 18
font-weight = 700
color = "#cdd6f4"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 240
height = 36
display-icon = true
font-family = Inter
font-size = 13
icon = password.svg
icon-size = 16
content-color = "#cdd6f4"
background-color = "#181825"
background-opacity = 0.75
border-size = 1
border-color = "#cba6f7"
border-radius-left = 10
border-radius-right = 10
margin-top = 12

[LoginScreen.LoginArea.LoginButton]
background-color = "#181825"
background-opacity = 0.75
active-background-color = "#cba6f7"
active-background-opacity = 0.90
icon = arrow-right.svg
icon-size = 18
content-color = "#cba6f7"
active-content-color = "#11111b"
border-size = 1
border-color = "#cba6f7"
border-radius-left = 10
border-radius-right = 10
margin-left = 6
show-text-if-no-password = true
hide-if-not-needed = false
font-family = Inter
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Iniciando sesión..."
font-family = Inter
font-weight = 600
font-size = 14
icon-size = 28
icon = spinner.svg
color = "#cba6f7"
spacing = 8

[LoginScreen.LoginArea.WarningMessage]
font-family = Inter
font-size = 12
font-weight = 500
normal-color = "#cdd6f4"
warning-color = "#f9e2af"
error-color = "#f38ba8"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 40
margin-right = 40
margin-bottom = 40
margin-left = 40
size = 34
border-radius = 8
spacing = 12
font-family = Inter

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 34
item-spacing = 4
padding = 6
display-scrollbar = true
margin = 6
background-color = "#181825"
background-opacity = 0.90
active-option-background-color = "#cba6f7"
active-option-background-opacity = 0.25
content-color = "#cdd6f4"
active-content-color = "#cba6f7"
font-family = Inter
border-size = 1
border-color = "#313244"
font-size = 12
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = bottom-left
index = 0
popup-direction = up
popup-align = center
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#181825"
background-opacity = 0.60
active-background-opacity = 0.90
content-color = "#cdd6f4"
active-content-color = "#cba6f7"
border-size = 1
border-color = "#313244"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = bottom-right
index = 0
popup-direction = up
popup-align = center
popup-width = 180
display-layout-name = true
background-color = "#181825"
background-opacity = 0.60
active-background-opacity = 0.90
content-color = "#cdd6f4"
active-content-color = "#cba6f7"
border-size = 1
border-color = "#313244"
font-size = 11
icon = language.svg
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = bottom-right
index = 0
background-color = "#181825"
background-opacity = 0.60
active-background-opacity = 0.90
content-color = "#cdd6f4"
active-content-color = "#cba6f7"
border-size = 1
border-color = "#313244"
icon = keyboard.svg
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = bottom-right
index = 0
popup-direction = up
popup-align = center
popup-width = 100
background-color = "#181825"
background-opacity = 0.60
active-background-opacity = 0.90
content-color = "#cdd6f4"
active-content-color = "#f38ba8"
border-size = 1
border-color = "#313244"
icon = power.svg
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = login
start-hidden = true
background-color = "#181825"
background-opacity = 0.85
key-content-color = "#cdd6f4"
key-color = "#313244"
key-opacity = 0.60
key-active-background-color = "#cba6f7"
key-active-opacity = 0.80
selection-background-color = "#cba6f7"
selection-content-color = "#11111b"
primary-color = "#cdd6f4"
accent-color = "#11111b"
border-size = 1
border-color = "#45475a"

[Tooltips]
enable = true
font-family = Inter
font-size = 11
content-color = "#cdd6f4"
background-color = "#181825"
background-opacity = 0.85
border-radius = 6
disable-user = false
disable-login-button = false
