# =============================================================================
#   KITTY — Terminal
#   La paleta de colores la genera Noctalia (themes/noctalia.conf).
# =============================================================================

# Fuente y legibilidad
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5
adjust_line_height 105%

# Ventana
window_padding_width 10
background_opacity   0.96
dynamic_background_opacity yes

# Cursor y scroll
cursor_shape          beam
cursor_blink_interval 0.6
scrollback_lines      10000
mouse_hide_wait       2.0

# Pestañas
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_edge           bottom
active_tab_font_style  bold
inactive_tab_font_style normal

# Atajos cómodos
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+plus  increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0     reset_font_size

# Splits (kitty como multiplexor): ctrl+shift+enter divide, ctrl+alt+flechas navega
enabled_layouts splits,stack
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+z toggle_layout stack
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
map ctrl+shift+n new_os_window_with_cwd
inactive_text_alpha 0.75

# Detalles pro
cursor_trail             3
cursor_trail_decay       0.1 0.3
copy_on_select           clipboard
strip_trailing_spaces    smart
url_style                curly
underline_hyperlinks     always
shell_integration        enabled
hide_window_decorations  yes
tab_title_template       "{index}: {tab.active_wd.rsplit('/', 1)[-1] or '/'}"
tab_bar_min_tabs         2

# Sin sonido de campana
enable_audio_bell no
confirm_os_window_close 0

include themes/noctalia.conf
